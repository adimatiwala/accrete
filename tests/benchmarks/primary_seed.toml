# Behavioural benchmarks (accrete.md Section 10, layer 3).
#
# Golden hashes fail on any change; these ranges fail only when behaviour
# leaves a sensible range, so they keep passing while the model is retuned.
# Values observed when the ranges were first set (seed 1, default config, the
# commit that added this file) are noted after each range. Widen or narrow a
# range only deliberately, and record why in accrete.md Appendix A.
#
# Keys are fields of the daily metrics row on `day` (see
# simulation/metrics.rs), or one of the derived measures computed by
# crates/accrete-core/tests/benchmarks.rs:
#   travel_per_food_run       tiles walked per unit of food gathered, whole run
#   homes_near_fertile_lift   share of occupied homes within 2 tiles of a tile
#                             with fertility >= 0.5, minus the same share for
#                             all land tiles (0 = no better than random)
# Boolean metrics (e.g. at_cap) count as 0 or 1.
#   births_and_old_age_deaths 1 if both births and old-age deaths occurred

seed = 1
day = 100

[ranges]
population = [200, 420]                  # observed 284
total_deaths_deprivation = [0, 3]        # observed 0
mean_hunger = [0.0, 0.35]                # observed 0.18
homed_fraction = [0.9, 1.0]              # observed 1.00
pathology_oscillating = [0, 5]           # observed 0
pathology_stuck = [0, 5]                 # observed 0
pathology_starved_beside_food = [0, 0]   # observed 0
pathology_idle = [0, 20]                 # observed 0
travel_per_food_run = [0.2, 1.0]         # observed 0.48 (low = agents stopped moving)
homes_near_fertile_lift = [0.03, 1.0]   # observed 0.10
births_and_old_age_deaths = [1, 1]       # observed 1
at_cap = [0, 0]                          # observed 0 (false)

# Baselines (accrete.md Section 10, layer 4), run for `baseline_day` days:
# normal agents must clearly beat random ones, and must not beat omniscient
# ones by more than noise.
[baselines]
baseline_day = 60
min_population_ratio_normal_over_random = 2.0       # observed 3.3 (223 / 67)
max_population_ratio_normal_over_omniscient = 1.05  # observed 0.93 (223 / 240)
