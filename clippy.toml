# Bit-identical determinism (accrete.md, "Cross-platform determinism"):
# std transcendental float functions call the platform libm, which differs
# between macOS and Windows. Use `libm` or avoid them. `mul_add` may fuse.
disallowed-methods = [
    { path = "f32::sin", reason = "platform libm; use libm::sinf" },
    { path = "f32::cos", reason = "platform libm; use libm::cosf" },
    { path = "f32::tan", reason = "platform libm" },
    { path = "f32::asin", reason = "platform libm" },
    { path = "f32::acos", reason = "platform libm" },
    { path = "f32::atan", reason = "platform libm" },
    { path = "f32::atan2", reason = "platform libm" },
    { path = "f32::sinh", reason = "platform libm" },
    { path = "f32::cosh", reason = "platform libm" },
    { path = "f32::tanh", reason = "platform libm" },
    { path = "f32::exp", reason = "platform libm; use libm::expf" },
    { path = "f32::exp2", reason = "platform libm" },
    { path = "f32::exp_m1", reason = "platform libm" },
    { path = "f32::ln", reason = "platform libm; use libm::logf" },
    { path = "f32::ln_1p", reason = "platform libm" },
    { path = "f32::log", reason = "platform libm" },
    { path = "f32::log2", reason = "platform libm" },
    { path = "f32::log10", reason = "platform libm" },
    { path = "f32::powf", reason = "platform libm; use libm::powf" },
    { path = "f32::powi", reason = "not guaranteed identical across platforms" },
    { path = "f32::hypot", reason = "platform libm" },
    { path = "f32::cbrt", reason = "platform libm" },
    { path = "f32::mul_add", reason = "may fuse; results differ by platform" },
    { path = "f64::sin", reason = "platform libm; use libm::sin" },
    { path = "f64::cos", reason = "platform libm; use libm::cos" },
    { path = "f64::tan", reason = "platform libm" },
    { path = "f64::asin", reason = "platform libm" },
    { path = "f64::acos", reason = "platform libm" },
    { path = "f64::atan", reason = "platform libm" },
    { path = "f64::atan2", reason = "platform libm" },
    { path = "f64::sinh", reason = "platform libm" },
    { path = "f64::cosh", reason = "platform libm" },
    { path = "f64::tanh", reason = "platform libm" },
    { path = "f64::exp", reason = "platform libm; use libm::exp" },
    { path = "f64::exp2", reason = "platform libm" },
    { path = "f64::exp_m1", reason = "platform libm" },
    { path = "f64::ln", reason = "platform libm; use libm::log" },
    { path = "f64::ln_1p", reason = "platform libm" },
    { path = "f64::log", reason = "platform libm" },
    { path = "f64::log2", reason = "platform libm" },
    { path = "f64::log10", reason = "platform libm" },
    { path = "f64::powf", reason = "platform libm; use libm::pow" },
    { path = "f64::powi", reason = "not guaranteed identical across platforms" },
    { path = "f64::hypot", reason = "platform libm" },
    { path = "f64::cbrt", reason = "platform libm" },
    { path = "f64::mul_add", reason = "may fuse; results differ by platform" },
    { path = "std::collections::hash_map::DefaultHasher::new", reason = "unstable across Rust versions; use accrete_core::hash" },
]
