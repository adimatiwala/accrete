[package]
name = "accrete-py"
description = "Python bindings for the Accrete reinforcement-learning environment."
version.workspace = true
# PyO3 0.22 macro output targets edition 2021 (unsafe-op-in-unsafe-fn).
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
accrete-core.workspace = true
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"
toml.workspace = true
