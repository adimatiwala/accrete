[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "accrete-rl"
version = "0.1.0"
description = "Accrete household and market reinforcement-learning environment"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "gymnasium>=1.1,<2"]

[project.optional-dependencies]
train = ["sb3-contrib>=2.6,<3"]
test = ["pytest>=7,<10"]

[tool.maturin]
python-source = "python"
module-name = "accrete_rl._core"
