[workspace]
resolver = "3"
members = [
    "crates/accrete-core",
    "crates/accrete-viz",
    "crates/accrete-cli",
    "crates/accrete-viewer",
    "crates/accrete-py",
]
default-members = [
    "crates/accrete-core",
    "crates/accrete-viz",
    "crates/accrete-cli",
    "crates/accrete-viewer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"

[workspace.dependencies]
accrete-core = { path = "crates/accrete-core" }
accrete-viz = { path = "crates/accrete-viz" }
rand_core = "0.6"
rand_chacha = { version = "0.3", features = ["serde1"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
png = "0.17"
macroquad = "0.4"
# Bundled SQLite so the run index works offline on macOS and Windows.
rusqlite = { version = "0.32", features = ["bundled"] }

# Release and debug builds must produce identical simulation results. Nothing
# here may enable fast-math or CPU-specific code generation.
[profile.release]
debug = false
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
