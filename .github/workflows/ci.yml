name: ci

# Bit-identical results are required on macOS (Apple Silicon) and Windows.
# The same golden hashes in tests/golden/ are checked on both.
#
# Path filtering: the `changes` job decides from the changed files what has to
# run (see .github/scripts/ci-changes.sh). Docs-only changes skip the Rust job;
# front-end-only changes skip the slow debug pass of accrete-core. Pushes to
# main and manual runs always run everything. `ci-result` always reports, so
# it is the one check to require in branch protection.
#
# Triggers: pull requests, pushes to main, and manual runs (Actions tab, any
# branch). Feature branches are tested through their PR, so a branch with an
# open PR is not built twice; a newer push to a PR cancels its older run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      core: ${{ steps.filter.outputs.core }}
      viewer: ${{ steps.filter.outputs.viewer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect what changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # PRs are filtered against their base; pushes to main and manual
          # runs always run everything.
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            *) base="" ;;
          esac
          echo "Comparing ${base:-<none: run everything>}..HEAD"
          bash .github/scripts/ci-changes.sh "$base" HEAD | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (bans non-deterministic float methods in accrete-core)
        run: cargo clippy -p accrete-core -p accrete-cli -p accrete-viz --all-targets -- -D warnings
      - name: Test (release)
        run: cargo test --release -p accrete-core -p accrete-cli -p accrete-viz
      - name: Test (debug; must match the same golden hashes)
        if: needs.changes.outputs.core == 'true'
        run: cargo test -p accrete-core
      - name: Build viewer
        if: needs.changes.outputs.viewer == 'true'
        run: cargo build --release -p accrete-viewer
      - name: Headless smoke run
        run: cargo run --release -p accrete-cli -- run --seed 1 --days 30 --every 10 --check -o results

  ci-result:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "changes: $CHANGES, test: $TEST"
          [ "$CHANGES" = success ] || exit 1
          case "$TEST" in
            success | skipped) ;;   # skipped = nothing Rust-related changed
            *) exit 1 ;;
          esac
